# Reverse proxy in front of the calculator-app service (Docker Compose network).
# Mounted read-only at /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS and re-resolve periodically, so that when the
    # pipeline recreates calculator-app (new container IP) nginx keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $calculator_upstream http://calculator-app:8080;

    location / {
        proxy_pass $calculator_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Lightweight liveness endpoint for the proxy itself
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
