# Calculator API stack: Spring Boot app behind an Nginx reverse proxy.
# Fixed project name keeps re-deploys from Jenkins idempotent.
name: calculator

services:
  calculator-app:
    image: ${DOCKERHUB_USER:-local}/calculator-api:${IMAGE_TAG:-latest}
    build: .
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx256m}
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - calculator-net

  nginx:
    build: ./nginx
    image: ${DOCKERHUB_USER:-local}/calculator-nginx:${IMAGE_TAG:-latest}
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      calculator-app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calculator-net

networks:
  calculator-net:
    driver: bridge
